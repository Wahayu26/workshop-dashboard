version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bengkelku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bengkelku_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bengkelku_secret}
      POSTGRES_DB: ${DB_NAME:-bengkelku_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bengkelku_user -d bengkelku_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bengkelku-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
